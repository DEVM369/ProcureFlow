name: Unit tests and source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Scan source
        run: python -B scripts/audit_release.py

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check browser JavaScript
        run: node --check demo/static/app.js

      # Integration checks require a separately provisioned local MCP environment.
